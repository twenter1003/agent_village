<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>바다 마을 장면</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&amp;family=Gowun+Dodum&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: {{w}}px; height: {{h}}px; overflow: hidden; background: linear-gradient(#d3eff2, #bfe2e8 55%, #a9d9e2); font-family: 'Gowun Dodum', 'Apple SD Gothic Neo', sans-serif; color: #1f3850">
<svg width="{{w}}" height="{{h}}" viewBox="0 0 1440 900" preserveAspectRatio="none" aria-hidden="true" style="position: absolute; left: 0; top: 0">
<g fill="#ffffff"><path d="M170 -10L262 -10L96 910L-20 910Z" fill-opacity="0.2"></path><path d="M520 -10L572 -10L420 910L352 910Z" fill-opacity="0.14"></path><path d="M880 -10L960 -10L812 910L716 910Z" fill-opacity="0.18"></path><path d="M1250 -10L1300 -10L1180 910L1120 910Z" fill-opacity="0.12"></path></g>
</svg>
<div style="position: absolute; left: {{wx}}px; top: {{wy}}px; width: 1200px; height: 700px; transform: scale({{zoom}}); transform-origin: 0 0">

<svg width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="바다 마을 바닥: 모래 해저, 조개 자갈 십자 길, 가운데 넓적돌 광장" style="position: absolute; left: 0; top: 0; overflow: visible">
<defs>
<radialGradient id="{{shId}}" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#2e4b66" stop-opacity="0.24"></stop><stop offset="0.6" stop-color="#2e4b66" stop-opacity="0.14"></stop><stop offset="1" stop-color="#2e4b66" stop-opacity="0"></stop></radialGradient>
<clipPath id="{{clipId}}"><polygon points="600,150 1112,406 600,662 88,406"></polygon></clipPath>
</defs>
<g fill="#a8d5de"><path d="M-120 330C-70 280 10 268 70 284C112 238 190 228 246 252C288 222 336 226 372 246L372 440L-120 440Z"></path><path d="M828 246C866 226 914 222 956 252C1012 228 1090 238 1132 284C1192 268 1270 280 1320 330L1320 440L828 440Z"></path></g>
<g fill="#9fcfd8"><path d="M150 310C140 256 162 214 150 164C145 132 156 112 152 90C161 112 165 132 159 164C171 214 151 258 162 310Z"></path><path d="M198 300C192 262 210 232 202 196C198 172 206 158 204 142C212 158 214 172 210 196C218 232 204 264 208 300Z"></path><path d="M1000 300C994 262 1012 232 1004 196C1000 172 1008 158 1006 142C1014 158 1016 172 1012 196C1020 232 1006 264 1010 300Z"></path><path d="M1052 310C1042 256 1064 214 1052 164C1047 132 1058 112 1054 90C1063 112 1067 132 1061 164C1073 214 1053 258 1064 310Z"></path></g>
<g stroke="#2e4b66" stroke-width="3" stroke-linejoin="round">
<polygon fill="#a1acb9" points="88,406 600,662 600,676 88,420"></polygon>
<polygon fill="#8894a3" points="600,662 1112,406 1112,420 600,676"></polygon>
<polygon fill="#f3e4c3" points="600,150 1112,406 600,662 88,406"></polygon>
</g>
<g stroke="#2e4b66" stroke-width="1.5"><circle cx="150" cy="444" r="2.6" fill="#f6aa98"></circle><circle cx="260" cy="499" r="2.2" fill="#f59b62"></circle><circle cx="380" cy="559" r="2.6" fill="#a893dc"></circle><circle cx="470" cy="604" r="2.2" fill="#f6aa98"></circle><circle cx="560" cy="649" r="2.4" fill="#f59b62"></circle><circle cx="660" cy="639" r="2.4" fill="#a893dc"></circle><circle cx="760" cy="589" r="2.2" fill="#f6aa98"></circle><circle cx="880" cy="529" r="2.6" fill="#f59b62"></circle><circle cx="990" cy="474" r="2.2" fill="#f6aa98"></circle><circle cx="1080" cy="429" r="2.4" fill="#a893dc"></circle></g>
<g fill="#7d8998"><circle cx="210" cy="470" r="1.4"></circle><circle cx="330" cy="534" r="1.2"></circle><circle cx="520" cy="630" r="1.3"></circle><circle cx="710" cy="614" r="1.4"></circle><circle cx="930" cy="504" r="1.2"></circle><circle cx="1040" cy="449" r="1.3"></circle></g>
<polygon fill="#f6cdb4" points="376,262 888,518 824,550 312,294"></polygon>
<polygon fill="#f6cdb4" points="824,262 888,294 376,550 312,518"></polygon>
<polygon fill="#e4e8ec" points="600,342 728,406 600,470 472,406"></polygon>
<path d="M568 358L696 422M536 374L664 438M504 390L632 454M632 358L504 422M664 374L536 438M696 390L568 454" fill="none" stroke="#c9d0d7" stroke-width="1.5"></path>
<g fill="#fff5ee"><ellipse cx="420" cy="290" rx="2.8" ry="1.4"></ellipse><ellipse cx="780" cy="470" rx="2.4" ry="1.2"></ellipse><ellipse cx="838" cy="300" rx="2.8" ry="1.4"></ellipse><ellipse cx="420" cy="522" rx="2.4" ry="1.2"></ellipse><ellipse cx="352" cy="286" rx="2.2" ry="1.1"></ellipse><ellipse cx="760" cy="304" rx="2.4" ry="1.2"></ellipse><ellipse cx="450" cy="486" rx="2.2" ry="1.1"></ellipse></g>
<g fill="#e9b597"><circle cx="470" cy="306" r="1.4"></circle><circle cx="730" cy="486" r="1.3"></circle><circle cx="790" cy="280" r="1.4"></circle><circle cx="380" cy="536" r="1.3"></circle></g>
<path d="M200 380Q205 377 210 380M470 250Q475 247 480 250M760 300Q765 297 770 300M980 400Q985 397 990 400M700 610Q705 607 710 610M260 440Q265 437 270 440M880 440Q885 437 890 440M420 600Q425 597 430 600M560 214Q565 211 570 214" fill="none" stroke="#e6d1a6" stroke-width="1.8" stroke-linecap="round"></path>
<g clip-path="url(#{{clipId}})" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"><path d="M552 434q7 -3 14 0t14 0M1024 388q5 -4 10 0t10 0M608 448q6 -4 12 0t12 0M285 411q7 -3 14 0t14 0M730 549q5 -4 10 0t10 0M754 462q6 -4 12 0t12 0M541 573q6 -4 12 0t12 0M557 296q7 -3 14 0t14 0M415 273q6 -3 12 0t12 0M866 356q7 -3 14 0t14 0M947 349q7 -4 14 0t14 0M659 379q6 -4 12 0t12 0M311 353q7 -3 14 0t14 0M343 455q7 -3 14 0t14 0M472 382q6 -3 12 0t12 0M675 585q7 -4 14 0t14 0M696 304q6 -4 12 0t12 0M672 224q7 -4 14 0t14 0M582 518q5 -4 10 0t10 0M837 505q7 -4 14 0t14 0M452 496q5 -3 10 0t10 0M963 441q6 -3 12 0t12 0M683 458q5 -3 10 0t10 0M835 445q7 -3 14 0t14 0M798 404q5 -3 10 0t10 0M726 402q7 -4 14 0t14 0M372 329q6 -3 12 0t12 0M230 382q5 -3 10 0t10 0M477 439q7 -4 14 0t14 0M751 260q6 -4 12 0t12 0M390 517q6 -3 12 0t12 0M369 392q7 -3 14 0t14 0M787 318q6 -3 12 0t12 0M466 300q6 -4 12 0t12 0M623 619q7 -3 14 0t14 0M909 466q5 -3 10 0t10 0M520 232q7 -4 14 0t14 0M412 429q6 -3 12 0t12 0M472 550q5 -4 10 0t10 0M620 289q5 -3 10 0t10 0M570 362q5 -4 10 0t10 0M883 413q5 -3 10 0t10 0M599 177q6 -3 12 0t12 0M155 403q6 -3 12 0t12 0M259 465q6 -3 12 0t12 0M735 345q6 -3 12 0t12 0"></path></g>
<g fill="url(#{{shId}})">
<ellipse cx="544" cy="252" rx="60" ry="26"></ellipse><ellipse cx="672" cy="252" rx="60" ry="26"></ellipse><ellipse cx="608" cy="316" rx="60" ry="26"></ellipse>
<ellipse cx="928" cy="380" rx="60" ry="26"></ellipse><ellipse cx="832" cy="428" rx="60" ry="26"></ellipse><ellipse cx="736" cy="540" rx="60" ry="26"></ellipse>
<ellipse cx="320" cy="364" rx="60" ry="26"></ellipse><ellipse cx="384" cy="428" rx="60" ry="26"></ellipse><ellipse cx="224" cy="412" rx="60" ry="26"></ellipse><ellipse cx="288" cy="476" rx="60" ry="26"></ellipse>
<ellipse cx="608" cy="540" rx="60" ry="26"></ellipse><ellipse cx="606" cy="414" rx="62" ry="28"></ellipse>
</g>
</svg>

<sc-for list="{{ents}}" as="e" hint-placeholder-count="36">
<div style="position: absolute; left: {{e.l}}px; top: {{e.t}}px">
<sc-if value="{{e.isB}}" hint-placeholder-val="{{false}}"><dc-import name="SeaBuilding" body="{{e.body}}" roof="{{e.roof}}" sign="{{e.sign}}" slot="{{e.slot}}" stage="{{e.stage}}" progress="{{e.p}}" ground="false" hint-size="160px,256px"></dc-import></sc-if>
<sc-if value="{{e.isP}}" hint-placeholder-val="{{false}}"><dc-import name="SeaProp" kind="{{e.kind}}" scale="1" phase="{{e.phase}}" hint-size="96px,160px"></dc-import></sc-if>
<sc-if value="{{e.isC}}" hint-placeholder-val="{{false}}"><dc-import name="SeaCritter" species="{{e.sp}}" pose="{{e.pose}}" role="{{e.role}}" scale="0.45" flip="{{e.flip}}" phase="{{e.phase}}" bubbles="{{e.bub}}" hint-size="58px,62px"></dc-import></sc-if>
</div>
</sc-for>

<sc-if value="{{hose}}" hint-placeholder-val="{{true}}">
<svg width="1200" height="700" viewBox="0 0 1200 700" aria-hidden="true" style="position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none">
<path d="M548 374C553 340 540 300 548 250C556 200 545 124 552 40C555 0 552 -40 553 -90" fill="none" stroke="#2e4b66" stroke-width="4.5" stroke-linecap="round"></path>
<path d="M548 374C553 340 540 300 548 250C556 200 545 124 552 40C555 0 552 -40 553 -90" fill="none" stroke="#56708a" stroke-width="2" stroke-linecap="round"></path>
</svg>
</sc-if>

<sc-if value="{{fx}}" hint-placeholder-val="{{true}}">
<div style="position: absolute; left: 0; top: 0; pointer-events: none"><dc-import name="SeaFx" hint-size="1200px,700px"></dc-import></div>
</sc-if>

<sc-if value="{{labels}}" hint-placeholder-val="{{true}}">
<div style="position: absolute; left: 360px; top: 322px; padding: 6px 12px; background: #f9fdfc; border: 2.5px solid #2e4b66; border-radius: 14px; font-size: 13px; white-space: nowrap">결제 API는 이렇게 가요!</div>
<svg width="20" height="14" viewBox="0 0 20 14" aria-hidden="true" style="position: absolute; left: 440px; top: 352px"><path d="M2 0L10 12L16 0" fill="#f9fdfc" stroke="#2e4b66" stroke-width="2.5" stroke-linejoin="round"></path><rect x="0" y="-3" width="20" height="4" fill="#f9fdfc"></rect></svg>
<div style="position: absolute; left: 566px; top: 344px; display: flex; gap: 4px; padding: 8px 10px; background: #f9fdfc; border: 2.5px solid #2e4b66; border-radius: 14px"><span style="width: 6px; height: 6px; border-radius: 50%; background: #4f6883"></span><span style="width: 6px; height: 6px; border-radius: 50%; background: #4f6883"></span><span style="width: 6px; height: 6px; border-radius: 50%; background: #4f6883"></span></div>
<div style="position: absolute; left: 330px; top: 312px; font-family: 'Jua', sans-serif; font-size: 18px; color: #4f6883">z<span style="font-size: 13px; vertical-align: 8px">z</span></div>
<div style="position: absolute; left: 551px; top: 462px; display: flex; gap: 3px; padding: 4px 7px; background: #f9fdfc; border: 2px solid #2e4b66; border-radius: 999px"><span style="width: 8px; height: 8px; border-radius: 50%; border: 2px solid #2e4b66; background: #f7cb52"></span><span style="width: 8px; height: 8px; border-radius: 50%; border: 2px solid #2e4b66; background: #f7cb52"></span><span style="width: 8px; height: 8px; border-radius: 50%; border: 2px solid #2e4b66; background: #f7cb52"></span><span style="width: 8px; height: 8px; border-radius: 50%; border: 2px solid #2e4b66; background: #fbe9c4"></span><span style="width: 8px; height: 8px; border-radius: 50%; border: 2px solid #2e4b66; background: #f9fdfc"></span><span style="width: 8px; height: 8px; border-radius: 50%; border: 2px solid #2e4b66; background: #f9fdfc"></span></div>
<div style="position: absolute; left: 518px; top: 460px; width: 26px; height: 26px; box-sizing: border-box; border: 2.5px solid #2e4b66; border-radius: 50%; background: #f7cb52; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19.5L13 11.5M10.5 6.5L14.5 3.5L20.5 9.5L17.5 13.5Z" fill="none" stroke="#1f3850" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg></div>
<span style="position: absolute; left: 454px; top: 300px; padding: 1px 7px; background: #efe8df; border: 2px dashed #2e4b66; border-radius: 999px; font-size: 11px">Explore</span>
<span style="position: absolute; left: 632px; top: 282px; padding: 1px 7px; background: #efe8df; border: 2px dashed #2e4b66; border-radius: 999px; font-size: 11px">Plan</span>
<span style="position: absolute; left: 576px; top: 582px; padding: 1px 7px; background: #efe8df; border: 2px dashed #2e4b66; border-radius: 999px; font-size: 11px">general</span>
</sc-if>

</div>
<svg width="{{w}}" height="{{h}}" viewBox="0 0 1440 900" preserveAspectRatio="none" aria-hidden="true" style="position: absolute; left: 0; top: 0; pointer-events: none">
<g fill="#ffffff" fill-opacity="0.07"><path d="M170 -10L262 -10L96 910L-20 910Z"></path><path d="M880 -10L960 -10L812 910L716 910Z"></path></g>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"w":{"editor":"int","default":1440},"h":{"editor":"int","default":900},"zoom":{"editor":"range","min":0.6,"max":1.6,"step":0.05,"default":1.15},"dx":{"editor":"int","default":0},"dy":{"editor":"int","default":0},"labels":{"editor":"boolean","default":true},"fx":{"editor":"boolean","default":true},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
if (!this.uid) this.uid = 'sv' + Math.random().toString(36).slice(2, 9);
const p = this.props;
const on = (v, d) => (v === undefined || v === null ? d : (v === true || v === 'true'));
const w = Number(p.w ?? 1440);
const h = Number(p.h ?? 900);
const zoom = Number(p.zoom ?? 1.15);
const iso = (x, y) => [600 + 32 * (x - y), 150 + 16 * (x + y)];
const ents = [];
const B = (x0, y0, o) => { const c = iso(x0 + 1, y0 + 1); ents.push(Object.assign({ isB: true, isP: false, isC: false, l: c[0] - 80, t: c[1] - 208, d: c[1], body: 'shell-1f', roof: 'dome', sign: 'none', slot: '1', stage: 'done', p: 0.5 }, o)); };
const P = (x, y, kind, ph) => { const c = iso(x + 0.5, y + 0.5); ents.push({ isB: false, isP: true, isC: false, l: c[0] - 48, t: c[1] - 128, d: c[1] - 0.5, kind: kind, phase: ph || 0 }); };
const F = (x0, y0) => { const c = iso(x0 + 1, y0 + 1); ents.push({ isB: false, isP: true, isC: false, l: c[0] - 80, t: c[1] - 208, d: c[1], kind: 'clamfountain', phase: 0 }); };
const C = (sx, sy, o) => { ents.push(Object.assign({ isB: false, isP: false, isC: true, l: sx - 28.8, t: sy - 56.7, d: sy + 0.5, role: 'general', flip: false, phase: 0, bub: false }, o)); };
// 외부인 시설 (북쪽)
B(1, 3, { body: 'basalt-2f', roof: 'scallop', sign: 'library', slot: 'x' });
B(3, 1, { body: 'wreck-2f', roof: 'conch', sign: 'plan', slot: 'x' });
B(4, 4, { body: 'coral-1f', roof: 'dome', sign: 'agency', slot: 'x' });
// 완공된 작업 건물 (동쪽)
B(11, 1, { body: 'coral-1f', roof: 'scallop', sign: 'workshop', slot: '1' });
B(11, 4, { body: 'shell-1f', roof: 'conch', sign: 'cafe', slot: '2' });
B(13, 9, { body: 'wreck-2f', roof: 'scallop', sign: 'hall', slot: '4' });
B(14, 2, { stage: 'planned' });
// 팀원 집 (서쪽)
B(1, 10, { body: 'shell-1f', roof: 'dome', sign: 'home', slot: '1' });
B(4, 11, { body: 'coral-1f', roof: 'scallop', sign: 'home', slot: '2' });
B(1, 13, { body: 'shell-1f', roof: 'scallop', sign: 'home', slot: '3' });
B(4, 14, { body: 'coral-1f', roof: 'dome', sign: 'home', slot: '4' });
// 공사 현장 (남쪽)
B(11, 11, { body: 'basalt-2f', roof: 'dome', sign: 'guard', slot: '3', stage: 'frame', p: 0.5 });
B(14, 11, { stage: 'foundation' });
B(11, 14, { stage: 'planned' });
// 광장과 소품
F(7, 7);
P(6, 8, 'board'); P(9, 6, 'bench'); P(10, 6, 'jellypost'); P(9, 10, 'jellypost'); P(9, 13, 'jellypost'); P(5, 9, 'chest');
P(0, 1, 'kelp', 0); P(2, 0, 'coral'); P(0, 6, 'kelp', 1); P(15, 1, 'coral'); P(15, 5, 'kelp', 1); P(0, 11, 'kelp', 0); P(9, 15, 'coral');
P(15, 14, 'braincoral'); P(9, 3, 'seagrass', 1); P(6, 12, 'braincoral'); P(13, 13, 'seagrass', 0); P(3, 6, 'anemone', 1); P(0, 14, 'anemone', 0);
P(3, 12, 'rock'); P(10, 13, 'materials');
P(5, 6, 'starfish'); P(12, 10, 'starfish'); P(10, 3, 'urchin'); P(6, 11, 'urchin');
// 캐릭터
C(533, 545, { sp: 'otter', pose: 'hammer' });
C(600, 576, { sp: 'fish', pose: 'carry', role: 'general', phase: 1 });
C(478, 404, { sp: 'turtle', pose: 'talk', flip: true });
C(534, 428, { sp: 'hamster', pose: 'talk', phase: 3, bub: true });
C(312, 381, { sp: 'seal', pose: 'rest', d: 406 });
C(476, 292, { sp: 'fish', pose: 'walk', role: 'explore', flip: true, phase: 2 });
C(650, 276, { sp: 'fish', pose: 'stand', role: 'plan', phase: 4 });
ents.sort((a, b) => a.d - b.d);
return {
shId: this.uid + '-sh', clipId: this.uid + '-top',
w: w, h: h, zoom: zoom,
wx: (w - 1200 * zoom) / 2 + Number(p.dx ?? 0), wy: (h - 700 * zoom) / 2 + Number(p.dy ?? 0),
ents: ents, labels: on(p.labels, true), fx: on(p.fx, true), hose: true
};
}
}
</script>
</body>
</html>
