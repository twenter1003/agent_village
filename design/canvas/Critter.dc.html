<script type="text/x-dc" data-dc-script data-props='{"species":{"editor":"enum","options":["bear","rabbit","raccoon","penguin","visitor"],"default":"bear"},"role":{"editor":"enum","options":["explore","plan","general"],"default":"general"},"pose":{"editor":"enum","options":["stand","walk","hammer","carry","cheer","talk","rest"],"default":"stand"},"mode":{"editor":"enum","options":["full","face"],"default":"full"},"scale":{"editor":"float","min":0.3,"max":3,"step":0.05,"default":1},"animate":{"editor":"boolean","default":true},"flip":{"editor":"boolean","default":false},"phase":{"editor":"int","min":0,"max":20,"default":0},"shadow":{"editor":"boolean","default":true},"$preview":{"width":128,"height":138}}'>
class Component extends DCLogic {
componentDidMount() {
this.timer = setInterval(() => {
const a = this.props.animate;
if (!(a === false || a === 'false')) this.setState({ tick: ((this.state && this.state.tick) || 0) + 1 });
}, 150);
}
componentWillUnmount() {
clearInterval(this.timer);
}
renderVals() {
if (!this.uid) this.uid = 'c' + Math.random().toString(36).slice(2, 9);
const p = this.props;
const truthy = (v, d) => (v === undefined || v === null ? d : (v === true || v === 'true'));
const species = p.species ?? 'bear';
const pose = p.pose ?? 'stand';
const face = (p.mode ?? 'full') === 'face';
const s = Math.max(0.2, Number(p.scale ?? 1));
const animate = truthy(p.animate, true);
const tick = ((this.state && this.state.tick) || 0) + Number(p.phase ?? 0);
const Z = [0, 0, 0];
const AC = { armL: [-4, 6, -25], armR: [4, 6, 25] };
const POSES = {
stand: { rate: 5, frames: [{}, { body: [0, -1.5, 0], armL: [0, 0, 6], armR: [0, 0, -6], earL: [0, 0, -3], earR: [0, 0, 3] }] },
walk: { rate: 2, frames: [
{ footL: [0, -5, -12], body: [0, -2, -3], armL: [0, 0, 18], armR: [0, 0, 8], earL: [0, 0, -6], earR: [0, 0, -6], face: [-3, 0, 0], tail: [0, 0, 10] },
{ face: [-3, 0, 0], armL: [0, 0, 4], armR: [0, 0, -4] },
{ footR: [0, -5, 12], body: [0, -2, 3], armL: [0, 0, -8], armR: [0, 0, -18], earL: [0, 0, 6], earR: [0, 0, 6], face: [-3, 0, 0], tail: [0, 0, -10] },
{ face: [-3, 0, 0], armL: [0, 0, 4], armR: [0, 0, -4] }] },
hammer: { rate: 3, prop: 'hammer', frames: [
{ body: [0, -1, -3], armR: [0, 0, -40], armL: [0, 0, 10], face: [3, 0, 0], earL: [0, 0, -4], earR: [0, 0, -4] },
{ body: [1, 0, 4], armR: [0, 0, 70], armL: [0, 0, -4], face: [4, 1, 0], earL: [0, 0, 4], earR: [0, 0, 4], expr: 'h' }] },
carry: { rate: 2, prop: 'plank', frames: [
Object.assign({ footL: [0, -4, -10], body: [0, -1.5, -2] }, AC), Object.assign({}, AC),
Object.assign({ footR: [0, -4, 10], body: [0, -1.5, 2] }, AC), Object.assign({}, AC)] },
cheer: { rate: 3, frames: [
{ body: [0, -9, 0], footL: [0, -7, -10], footR: [0, -7, 10], armL: [0, -8, 120], armR: [0, -8, -120], earL: [0, 0, -14], earR: [0, 0, 14], tail: [0, 0, 15], expr: 'h' },
{ body: [0, -2, 0], armL: [0, -6, 105], armR: [0, -6, -105], earL: [0, 0, -6], earR: [0, 0, 6], expr: 'h' }] },
talk: { rate: 3, frames: [
{ body: [0, 0, 2], armR: [0, -2, -35], face: [2, 0, 0], earR: [0, 0, 5], expr: 't' },
{ armR: [0, 0, -20], face: [2, 0, 0] }] },
rest: { rate: 6, frames: [
{ body: [0, 1, -5], footL: [-2, 0, 0], footR: [2, 0, 0], armL: [2, 0, -10], armR: [-2, 0, 10], earL: [0, 0, -12], earR: [0, 0, 12], face: [-1, 2, 0], tail: [0, 0, -6], expr: 's' },
{ body: [0, 2, -5], footL: [-2, 0, 0], footR: [2, 0, 0], armL: [2, 1, -10], armR: [-2, 1, 10], earL: [0, 0, -14], earR: [0, 0, 14], face: [-1, 2, 0], tail: [0, 0, -6], expr: 's' }] }
};
const SP = {
bear: { name: '곰', fur: '#c0804f', foot: '#a86c40', nose: '#5a2e2e', earL: [-22, -58], earR: [22, -58], tail: [0, -10], gain: 1, lid: '#5a2e2e' },
rabbit: { name: '토끼', fur: '#fbf3e8', foot: '#eadbc7', nose: '#f5a3a8', earL: [-12, -66], earR: [12, -66], tail: [0, -10], gain: 1.8, lid: '#5a2e2e' },
raccoon: { name: '너구리', fur: '#aaa2ad', foot: '#938a97', nose: '#5a2e2e', earL: [-27, -54], earR: [27, -54], tail: [-32, -18], gain: 1, lid: '#fff9ee' },
penguin: { name: '펭귄', fur: '#4a5a7e', foot: '#f4a340', nose: '#5a2e2e', earL: [-20, -60], earR: [20, -60], tail: [0, -10], gain: 1, lid: '#5a2e2e' },
visitor: { name: '외부인', fur: '#d9ccb8', foot: '#bcae9c', nose: '#5a2e2e', earL: [-22, -58], earR: [22, -58], tail: [0, -10], gain: 1, lid: '#5a2e2e' }
};
const CAPS = { explore: '#5aa77a', plan: '#6f97d8', general: '#f0b24a' };
const sp = SP[species] || SP.bear;
const P = POSES[pose] || POSES.stand;
const frame = face ? {} : P.frames[animate ? Math.floor(tick / P.rate) % P.frames.length : 0];
const g = (k) => frame[k] || Z;
const ear = (k) => { const v = g(k); return [v[0], v[1], v[2] * sp.gain]; };
const tf = (v, pv) => 'translate(' + v[0] + ' ' + v[1] + ') rotate(' + v[2] + ' ' + pv[0] + ' ' + pv[1] + ')';
const vis = (on) => (on ? 'inline' : 'none');
const ex = frame.expr || 'n';
const isP = species === 'penguin';
const isR = species === 'raccoon';
return {
shId: this.uid + '-sh',
rw: (face ? 88 : 128) * s, rh: (face ? 88 : 138) * s,
vb: face ? '-44 -86 88 88' : '-64 -126 128 138',
assetId: species + '.' + (face ? 'face' : pose), aria: sp.name + (face ? ' 얼굴' : ''),
shadow: vis(!face && truthy(p.shadow, true)),
flipT: truthy(p.flip, false) ? 'scale(-1 1)' : 'scale(1 1)',
w3: 3 / s, w2: 2 / s, w26: 2.6 / s, w9: 9 / s,
sp: { bear: vis(species === 'bear'), rabbit: vis(species === 'rabbit'), raccoon: vis(isR), penguin: vis(isP), visitor: vis(species === 'visitor') },
c: {
cap: CAPS[p.role] || CAPS.general,
fur: sp.fur, foot: sp.foot, nose: sp.nose, lid: sp.lid, armRy: isP ? 11 : 9.5,
noseDisp: vis(!isP), mouthDisp: vis(!isP), plainEyes: vis(!isR),
earLPv: sp.earL.join(','), earRPv: sp.earR.join(','), tailPv: sp.tail.join(',')
},
t: {
footL: tf(g('footL'), [-16, 0]), footR: tf(g('footR'), [16, 0]), body: tf(g('body'), [0, 0]),
earL: tf(ear('earL'), sp.earL), earR: tf(ear('earR'), sp.earR), face: tf(g('face'), [0, -34]),
armL: tf(g('armL'), [-34, -26]), armR: tf(g('armR'), [34, -26]), tail: tf(g('tail'), sp.tail)
},
e: { n: vis(ex === 'n'), h: vis(ex === 'h'), t: vis(ex === 't'), s: vis(ex === 's') },
pH: vis(!face && P.prop === 'hammer'), pP: vis(!face && P.prop === 'plank')
};
}
}
</script>
